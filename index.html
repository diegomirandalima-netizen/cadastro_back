<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><strong>cadastro do aluno</strong></title>
</head>
<body>
        <form>
            <div class="form-group">
                <label for="id_aluno">id_aluno: *</label>
                <input type="int" id="id_aluno" placeholder="Digite o id do aluno" required>
            <div>

                <div class="form-group">
                <label for="cpf">cpf: *</label>
                <input type="text" id="cpf" placeholder="Digite seu cpf" required>
            <div>

            <div class="form-group">
                <label for="nome">Nome Completo: *</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
            </div>

            <div class="form-group">
                <label for="nascimento">Data de Nascimento: *</label>
                <input type="date" id="Data de Nascimento" name="Data de Nascimento" placeholder="Data de Nascimento" required>
            </div>
>
            <div class="form-group">
                <label for="telefone">Telefone: *</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
            </div>
            <div class="form-group"> 
                <label for="email">E-mail: *</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
            </div>

            <div class="form-group"> 
                <label for="text">endereco: *</label>
                <input type="endereco" id="endereco" endereco="endereco" placeholder="rua, número, bairro" required>
            </div>
        </form>

    
</body>
</html>
