<!DOCTYPE html> 
<html lang="pt-br"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="stylesheet" href="style.css"> 
    <title>Cadastro de Aluno</title> 
</head> 
    <body> 

    <form action="salvar_aluno" method="POST">                         <!-- Abre o formulario definindo a rota de destino e o envio seguro por POST -->
        <h1 class="titulo"><strong>Cadastro de Alunos</strong></h1>    <!-- Titulo principal do formulario destacado em negrito grosso -->

        <div> 
            <label for="id_aluno">ID do Aluno:</label>                 <!-- Legenda vinculada ao campo ID do Aluno por meio do id -->
            <input type="text" id="id_aluno" name="id_aluno" placeholder="Gerado automaticamente" > <!-- Campo com texto de aviso em cinza para o codigo do aluno -->
        </div> 
        <div> 
            <label for="nome">Nome:</label>                             <!-- Legenda vinculada ao campo Nome por meio do id -->
            <input type="text" id="nome" name="nome" required>          <!-- Campo de texto obrigatorio para preenchimento do nome completo -->
        </div> 
        <div> 
            <label for="data_nascimento">Data de Nascimento:</label>    <!-- Legenda vinculada ao campo Data de Nascimento por meio do id -->
            <input type="date" id="data_nascimento" name="data_nascimento" required> <!-- Campo obrigatorio com calendario nativo para escolher a data -->
        </div> 
        <div> 
            <label for="cpf">CPF:</label>                               <!-- Legenda vinculada ao campo CPF por meio do id -->
            <input type="text" id="cpf" name="cpf" required>            <!-- Campo de texto obrigatorio para digitar o CPF do aluno -->
        </div> 
        <div> 
            <label for="telefone">Telefone:</label>                     <!-- Legenda vinculada ao campo Telefone por meio do id -->
            <input type="tel" id="telefone" name="telefone">            <!-- Campo especifico para receber o numero de telefone ou celular -->
        </div> 
        <div> 
            <label for="email">Email:</label>                           <!-- Legenda vinculada ao campo Email por meio do id -->
            <input type="email" id="email" name="email">                <!-- Campo de texto configurado para validar o formato de endereco eletronico -->
        </div> 
        <div> 
            <label for="endereco">Endereço:</label>                     <!-- Legenda vinculada ao campo Endereco por meio do id -->
            <input type="text" id="endereco" name="endereco">           <!-- Campo de texto livre para preencher a rua, numero e bairro -->
        </div> 
        <button class="botao" type="submit">Cadastrar</button>          <!-- Botao de envio que dispara as informacoes para o backend salvar_aluno -->
    </form> 

</body> 
</html>
